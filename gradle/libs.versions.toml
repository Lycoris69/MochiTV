[versions]
# ---- Build toolchain -------------------------------------------------------
agp             = "8.7.3"
kotlin          = "2.1.0"
ksp             = "2.1.0-1.0.29"

# ---- AndroidX core ---------------------------------------------------------
coreKtx         = "1.15.0"
activityCompose = "1.9.3"
lifecycle       = "2.8.7"

# ---- Compose ---------------------------------------------------------------
composeBom      = "2024.12.01"

# ---- Navigation ------------------------------------------------------------
navigationCompose = "2.8.5"

# ---- Dependency Injection --------------------------------------------------
hilt                  = "2.53.1"
hiltNavigationCompose = "1.2.0"

# ---- Room (local cache) ----------------------------------------------------
room = "2.6.1"

# ---- Network / scraping ----------------------------------------------------
okhttp = "4.12.0"
jsoup  = "1.18.3"

# ---- JSON serialisation (Room type converter) ------------------------------
gson = "2.10.1"

# ---- Video playback --------------------------------------------------------
media3 = "1.4.1"

# ---- Image loading ---------------------------------------------------------
coil = "2.7.0"

# ---- Test ------------------------------------------------------------------
junit              = "4.13.2"
junitAndroid       = "1.2.1"
espresso           = "3.6.1"
coroutinesTest     = "1.8.1"

[libraries]
# AndroidX core
androidx-core-ktx             = { group = "androidx.core",     name = "core-ktx",             version.ref = "coreKtx" }
androidx-activity-compose     = { group = "androidx.activity", name = "activity-compose",      version.ref = "activityCompose" }

# Lifecycle / ViewModel
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }

# Compose BOM + core artifacts (versions controlled by BOM)
androidx-compose-bom          = { group = "androidx.compose",          name = "compose-bom",              version.ref = "composeBom" }
androidx-ui                   = { group = "androidx.compose.ui",       name = "ui" }
androidx-ui-graphics          = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-ui-tooling           = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-ui-tooling-preview   = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-ui-test-manifest     = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
androidx-ui-test-junit4       = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-material3            = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core     = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt DI
hilt-android           = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",   name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# Network
okhttp         = { group = "com.squareup.okhttp3", name = "okhttp",               version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor",  version.ref = "okhttp" }

# HTML parsing
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# JSON (Room type converters)
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Video playback
media3-exoplayer      = { group = "androidx.media3", name = "media3-exoplayer",       version.ref = "media3" }
media3-exoplayer-hls  = { group = "androidx.media3", name = "media3-exoplayer-hls",   version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash",  version.ref = "media3" }
media3-ui             = { group = "androidx.media3", name = "media3-ui",              version.ref = "media3" }
media3-database       = { group = "androidx.media3", name = "media3-database",        version.ref = "media3" }

# Image loading
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Tests
junit                    = { group = "junit",                          name = "junit",                       version.ref = "junit" }
androidx-junit           = { group = "androidx.test.ext",              name = "junit",                       version.ref = "junitAndroid" }
androidx-espresso        = { group = "androidx.test.espresso",         name = "espresso-core",               version.ref = "espresso" }
kotlinx-coroutines-test  = { group = "org.jetbrains.kotlinx",         name = "kotlinx-coroutines-test",     version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application",               version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",         version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",                version.ref = "ksp" }
