# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle configuration cache for faster builds.
org.gradle.configuration-cache=true

# AndroidX is the standard; legacy Support Library is not used.
android.useAndroidX=true

# Each library's R class only contains its own resources (smaller R class).
android.nonTransitiveRClass=true

# Use Kotlin's official code style.
kotlin.code.style=official
